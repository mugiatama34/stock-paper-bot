name: Backtest

# Manual only. This is an analysis run, not part of the trading loop -- it costs
# several minutes of Actions time and never touches the live ledgers.
on:
  workflow_dispatch:
    inputs:
      years:
        description: "Kaç yıllık geçmiş test edilsin"
        required: true
        default: "3"
        type: choice
        options: ["1", "2", "3", "5"]
      cost_bps:
        description: "İşlem maliyeti (baz puan, tek yön). 0 = maliyetsiz, 10 = %0.10"
        required: true
        default: "0"
        type: choice
        options: ["0", "5", "10", "20"]
      universe_size:
        description: "Strateji başına hisse sayısı (büyük = daha gerçekçi, daha yavaş)"
        required: true
        default: "80"
        type: choice
        options: ["40", "80", "150", "300"]
      start_date:
        description: "Başlangıç tarihi (YYYY-MM-DD, opsiyonel). Verilirse end_date de verilmeli; 'years' yok sayılır."
        required: false
        default: ""
      end_date:
        description: "Bitiş tarihi (YYYY-MM-DD, opsiyonel). Verilirse start_date de verilmeli."
        required: false
        default: ""

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run backtest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        working-directory: scripts
        run: |
          if [ -n "${{ inputs.start_date }}" ]; then
            python backtest.py \
              --start ${{ inputs.start_date }} \
              --end ${{ inputs.end_date }} \
              --universe-size ${{ inputs.universe_size }} \
              --cost-bps ${{ inputs.cost_bps }}
          else
            python backtest.py \
              --years ${{ inputs.years }} \
              --universe-size ${{ inputs.universe_size }} \
              --cost-bps ${{ inputs.cost_bps }}
          fi

      - name: Commit results
        run: |
          git config user.name "stock-paper-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -n "${{ inputs.start_date }}" ]; then
            LABEL="${{ inputs.start_date }} -> ${{ inputs.end_date }}"
          else
            LABEL="${{ inputs.years }}y"
          fi
          git add reports/backtest.png reports/backtest.json reports/backtest_trades.json docs/backtest.html
          git diff --cached --quiet || git commit -m "Backtest $LABEL [skip ci]"
          git push
