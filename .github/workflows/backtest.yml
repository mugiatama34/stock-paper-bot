name: Backtest

# Manual only. This is an analysis run, not part of the trading loop -- it costs
# several minutes of Actions time and never touches the live ledgers.
on:
  workflow_dispatch:
    inputs:
      years:
        description: "Kaç yıllık geçmiş test edilsin"
        required: true
        default: "3"
        type: choice
        options: ["1", "2", "3", "5"]
      cost_bps:
        description: "İşlem maliyeti (baz puan, tek yön). 0 = maliyetsiz, 10 = %0.10"
        required: true
        default: "0"
        type: choice
        options: ["0", "5", "10", "20"]
      universe_size:
        description: "Evren kısıtı: 0 = tam evren (canlı ile aynı, varsayılan), N = en likit N hisse (dolar hacmine göre, hız kısıtı)"
        required: true
        default: "0"
        type: choice
        options: ["0", "40", "80", "150", "300"]
      start_date:
        description: "Başlangıç tarihi (YYYY-MM-DD, opsiyonel). Verilirse end_date de verilmeli; 'years' yok sayılır."
        required: false
        default: ""
      end_date:
        description: "Bitiş tarihi (YYYY-MM-DD, opsiyonel). Verilirse start_date de verilmeli."
        required: false
        default: ""

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run backtest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        working-directory: scripts
        run: |
          if [ -n "${{ inputs.start_date }}" ]; then
            python backtest.py \
              --start ${{ inputs.start_date }} \
              --end ${{ inputs.end_date }} \
              --universe-size ${{ inputs.universe_size }} \
              --cost-bps ${{ inputs.cost_bps }}
          else
            python backtest.py \
              --years ${{ inputs.years }} \
              --universe-size ${{ inputs.universe_size }} \
              --cost-bps ${{ inputs.cost_bps }}
          fi

      - name: Commit results
        run: |
          git config user.name "stock-paper-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -n "${{ inputs.start_date }}" ]; then
            LABEL="${{ inputs.start_date }} -> ${{ inputs.end_date }}"
          else
            LABEL="${{ inputs.years }}y"
          fi
          git add reports/backtest.png reports/backtest.json reports/backtest_trades_*.json docs/backtest.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Backtest $LABEL [skip ci]"

          attempt=1
          max_attempts=5
          until git push origin HEAD:${{ github.ref_name }}; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::git push $max_attempts denemeden sonra başarısız oldu."
              exit 1
            fi
            echo "Push reddedildi (deneme $attempt/$max_attempts), uzak değişiklikler alınıp tekrar denenecek..."
            git fetch origin ${{ github.ref_name }}
            git rebase origin/${{ github.ref_name }} || { echo "::error::rebase başarısız, çakışma var."; exit 1; }
            attempt=$((attempt + 1))
            sleep $((attempt * 3))
          done
