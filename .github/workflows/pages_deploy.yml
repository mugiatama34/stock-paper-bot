name: Deploy Dashboard

# Triggered by the other workflows finishing rather than by push: the bot's own
# commits carry "[skip ci]", which suppresses push-triggered runs entirely.
on:
  workflow_run:
    workflows: ["Trade Bot", "Daily Report", "Weekly Report", "Monthly Report", "Yearly Report", "Backtest"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
