name: Simulate Fresh Start

# Manual only. Salt okunur bir simülasyon -- ledger dosyalarına yazmaz, işlem
# yapmaz, Telegram bildirimi göndermez. Yalnızca reports/fresh_start_*.json
# üretir.
on:
  workflow_dispatch:
    inputs:
      strategy:
        description: "Simüle edilecek strateji"
        required: true
        default: "ai_momentum"
        type: choice
        options: ["ai_momentum", "mean_reversion", "balanced"]

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run simulation
        working-directory: scripts
        run: python simulate_fresh_start.py --strategy ${{ inputs.strategy }}

      - name: Commit report
        run: |
          git config user.name "stock-paper-bot"
          git config user.email "bot@users.noreply.github.com"
          git add reports/fresh_start_*.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fresh start simulation: ${{ inputs.strategy }} [skip ci]"

          attempt=1
          max_attempts=5
          until git push origin HEAD:${{ github.ref_name }}; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::git push $max_attempts denemeden sonra başarısız oldu."
              exit 1
            fi
            echo "Push reddedildi (deneme $attempt/$max_attempts), uzak değişiklikler alınıp tekrar denenecek..."
            git fetch origin ${{ github.ref_name }}
            git rebase origin/${{ github.ref_name }} || { echo "::error::rebase başarısız, çakışma var."; exit 1; }
            attempt=$((attempt + 1))
            sleep $((attempt * 3))
          done
