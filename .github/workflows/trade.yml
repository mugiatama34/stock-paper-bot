name: Trade Bot

on:
  schedule:
    # All three strategies read DAILY bars, so signals only change once the daily
    # candle closes -- running hourly just recomputes the same numbers. Two passes:
    #   17:30 UTC  mid-session, so trailing stops / stop-losses react intraday
    #   20:45 UTC  just before the US close, when the day's bar is effectively set
    - cron: "30 17 * * 1-5"
    - cron: "45 20 * * 1-5"
  workflow_dispatch: {}

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run trade bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        working-directory: scripts
        run: python trade_bot.py

      - name: Commit updated ledgers
        run: |
          git config user.name "stock-paper-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ docs/ reports/
          git diff --cached --quiet || git commit -m "Update ledgers [skip ci]"
          git push

      - name: Trigger Netlify deploy
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST -d '{}' "$HOOK" && echo "Netlify deploy tetiklendi"
          else
            echo "NETLIFY_BUILD_HOOK secret tanimli degil, atlandi"
          fi
