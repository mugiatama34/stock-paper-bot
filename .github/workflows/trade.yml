name: Trade Bot

on:
  schedule:
    # All three strategies read DAILY bars, so signals only change once the daily
    # candle closes -- running hourly just recomputes the same numbers. Two passes:
    #   17:30 UTC  mid-session, so trailing stops / stop-losses react intraday
    #   19:45 UTC  while the US market is still open, so notifications arrive in time
    - cron: "30 17 * * 1-5"
    - cron: "45 19 * * 1-5"
  workflow_dispatch: {}

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run trade bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        working-directory: scripts
        run: python trade_bot.py

      - name: Commit updated ledgers
        run: |
          git config user.name "stock-paper-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ docs/ reports/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update ledgers [skip ci]"

          attempt=1
          max_attempts=5
          until git push origin HEAD:${{ github.ref_name }}; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::git push $max_attempts denemeden sonra başarısız oldu."
              exit 1
            fi
            echo "Push reddedildi (deneme $attempt/$max_attempts), uzak değişiklikler alınıp tekrar denenecek..."
            git fetch origin ${{ github.ref_name }}
            git rebase origin/${{ github.ref_name }} || { echo "::error::rebase başarısız, çakışma var."; exit 1; }
            attempt=$((attempt + 1))
            sleep $((attempt * 3))
          done
