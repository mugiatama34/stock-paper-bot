name: Yearly Report

on:
  schedule:
    - cron: "0 23 31 12 *"
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Generate yearly report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        working-directory: scripts
        run: python generate_report.py --mode yearly

      - name: Commit report + dashboard
        run: |
          git config user.name "stock-paper-bot"
          git config user.email "bot@users.noreply.github.com"
          git add reports/ docs/
          git diff --cached --quiet || git commit -m "Yearly report [skip ci]"
          git push

      - name: Trigger Netlify deploy
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST -d '{}' "$HOOK" && echo "Netlify deploy tetiklendi"
          else
            echo "NETLIFY_BUILD_HOOK secret tanimli degil, atlandi"
          fi
