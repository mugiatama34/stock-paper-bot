name: Yearly Report

on:
  schedule:
    - cron: "0 23 31 12 *"
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Generate yearly report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        working-directory: scripts
        run: python generate_report.py --mode yearly

      - name: Commit report + dashboard
        run: |
          git config user.name "stock-paper-bot"
          git config user.email "bot@users.noreply.github.com"
          git add reports/ docs/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Yearly report [skip ci]"

          attempt=1
          max_attempts=5
          until git push origin HEAD:${{ github.ref_name }}; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::git push $max_attempts denemeden sonra başarısız oldu."
              exit 1
            fi
            echo "Push reddedildi (deneme $attempt/$max_attempts), uzak değişiklikler alınıp tekrar denenecek..."
            git fetch origin ${{ github.ref_name }}
            git rebase origin/${{ github.ref_name }} || { echo "::error::rebase başarısız, çakışma var."; exit 1; }
            attempt=$((attempt + 1))
            sleep $((attempt * 3))
          done
